<!doctype html>
<html>
	<head>
		<title>ytf-rocket</title>
		<script src="alpine.min.js" defer></script>
		<script src="tailwind.min.js"></script>
		<script src="search.js" defer type="module"></script>
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link
			href="https://fonts.googleapis.com/css2?family=Lato:ital,wght@0,100;0,300;0,400;0,700;0,900;1,100;1,300;1,400;1,700;1,900&display=swap"
			rel="stylesheet"
		/>
	</head>
	<body class="min-h-screen p-4 bg-black text-[#ededed]">
		<template id="VideoElement"></template>
		<script type="module">
			const response = await fetch("/VideoElement.html");

			if (!response.ok) {
				throw new Error("Failed to load VideoElement.html");
			}

			const html = await response.text();

			document.getElementById("VideoElement").innerHTML = html;

			window.dispatchEvent(new Event("video-template-ready"));
		</script>
		<!-- Spinner shown while /api/search is in flight; toggled via the hidden attribute in search.ts -->
		<div
			id="searchSpinner"
			class="fixed inset-0 flex items-center justify-center"
			role="status"
			aria-live="polite"
			hidden
		>
			<div
				class="mx-auto w-12 h-12 rounded-full border-4 border-[#424242] border-t-[#ededed] animate-spin"
			></div>
			<span class="sr-only text-white">Loading videos…</span>
		</div>
		<div id="searchResults" class="flex flex-wrap" />
	</body>
</html>
