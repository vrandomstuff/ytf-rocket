[package]
name = "ytf-rocket"
version = "0.1.0"
edition = "2024"

[dependencies]
innertube-rs = "0.10.1"
rocket = "0.5.2"
tokio = "1.54.1"
moka = { version = "0.12.16", features = ["future"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
hmac = "0.13.0"
sha2 = "0.11.1"
hex = "0.4.3"
getrandom = "0.4.3"
base64 = "0.23.1"
reqwest = "0.13.5"
regex = "1.13.1"

[build-dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
time = { version = "0.3", features = ["local-offset"] }
ureq = "3"
rquickjs = { version = "0.14.0", features = ["bindgen"] }
