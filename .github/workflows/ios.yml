
name: Build iOS Server

on:
  workflow_dispatch:
  push:
    branches:
      - master
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Build iOS ARM64
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Install frontend dependencies
        working-directory: web
        run: pnpm install --frozen-lockfile

      - name: Build frontend
        working-directory: web
        run: pnpm build

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2

      - name: Build server
        run: cargo build --release --target aarch64-apple-ios

      - name: Find server executable
        id: binary
        shell: bash
        run: |
          BINARY=$(cargo metadata --no-deps --format-version 1 \
            | jq -r --arg manifest "$GITHUB_WORKSPACE/Cargo.toml" \
              '.packages[]
              | select(.manifest_path == $manifest)
              | .targets[]
              | select(.kind | index("bin"))
              | .name' \
            | head -n 1)

          if [ -z "$BINARY" ]; then
            echo "No binary target found"
            exit 1
          fi

          echo "name=$BINARY" >> "$GITHUB_OUTPUT"

      - name: Upload iOS executable
        uses: actions/upload-artifact@v4
        with:
          name: rocket-server-ios-arm64
          path: target/aarch64-apple-ios/release/${{ steps.binary.outputs.name }}
          if-no-files-found: error
          retention-days: 30
